name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache
      - name: Build the image
        run: docker build -f benchmarks/Dockerfile -t replay .
      - name: Smoke test on cross3 and cube15
        run: docker run --rm replay bench run cross3 cube15
