name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coq-community/docker-coq-action@v1
        with:
          coq_version: '8.20.1'
          ocaml_version: '4.14.2-flambda'
          custom_script: |
            startGroup "Install the pinned dependencies"
              opam pin add -y -n coq-mathcomp-ssreflect https://github.com/Coq-Polyhedra/mathcomp.git#master
              opam pin add -y -n coq-mathcomp-fingroup https://github.com/Coq-Polyhedra/mathcomp.git#master
              opam pin add -y -n coq-mathcomp-algebra https://github.com/Coq-Polyhedra/mathcomp.git#master
              opam pin add -y -n coq-mathcomp-finmap https://github.com/Coq-Polyhedra/finmap.git#master
              opam pin add -y -n coq-mathcomp-bigenough https://github.com/math-comp/bigenough.git#1.0.3
              opam pin add -y -n coq-polyhedra https://github.com/Coq-Polyhedra/Coq-Polyhedra.git#master
              opam pin add -y -n coq-binreader https://github.com/Coq-Polyhedra/coq-binreader.git#main
              opam install -y -j 2 coq-mathcomp-algebra coq-mathcomp-finmap \
                coq-mathcomp-bigenough coq-polyhedra coq-binreader
            endGroup
            startGroup "Build the development and the extracted checker"
              sudo chown -R coq:coq .
              make rocq
              make extract
            endGroup
